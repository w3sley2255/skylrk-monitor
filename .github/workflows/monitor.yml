name: SKYLRK monitor

on:
  schedule:
    # Every 5 minutes (UTC), deliberately OFF the congested :00/:15/:30/:45 marks.
    #
    # "*/15" would fire at :00/:15/:30/:45 - the busiest minutes on GitHub's
    # scheduler, because that is what every example produces. Scheduled runs are
    # delayed or silently DROPPED under load, so those slots are the least
    # reliable ones available. Odd minutes dodge the stampede.
    #
    # GitHub also disables schedules after 60 days of repo inactivity - the
    # state commit at the end of this job counts as activity and keeps it alive.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Never let two checks run at once (avoids state write races).
concurrency:
  group: skylrk-monitor
  cancel-in-progress: false

permissions:
  contents: write         # needed to commit the updated state file back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          # Uncomment whichever channel you actually use:
          # DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # SMTP_HOST: ${{ secrets.SMTP_HOST }}
          # SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # SMTP_USER: ${{ secrets.SMTP_USER }}
          # SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # EMAIL_TO:   ${{ secrets.EMAIL_TO }}
        run: python skylrk_monitor.py --config config.yaml

      - name: Commit updated state
        if: always()   # persist state even if the run reported an error
        run: |
          git config user.name  "skylrk-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "chore: update monitor state [skip ci]"
            # rebase-pull in case the branch moved, then push
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
